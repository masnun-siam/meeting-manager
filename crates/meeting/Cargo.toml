[package]
name = "meeting"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = { version = "3", features = ["json"] }
keyring = { version = "3", features = ["apple-native"] }
