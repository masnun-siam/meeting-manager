name: desktop

on:
  push:
    branches: [main]
    paths: ["desktop/**", .github/workflows/desktop.yml, "scripts/repo-guards/**"]
  pull_request:
    paths: ["desktop/**", .github/workflows/desktop.yml, "scripts/repo-guards/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changed-line coverage gate diffs against the base branch
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npx vitest run --coverage 2>&1 | tee ../coverage-run.log
        shell: bash
      # vitest writes paths relative to the package; the gates read them from the repo root.
      - run: sed -i 's|^SF:src/|SF:desktop/src/|' coverage/lcov.info
      - run: ../scripts/repo-guards/coverage-log-guard.sh ../coverage-run.log coverage/lcov.info
      - if: github.event_name == 'pull_request'
        working-directory: .
        run: python3 -I scripts/repo-guards/changed-lines-coverage.py --base "origin/${{ github.base_ref }}" desktop/coverage/lcov.info -- 'desktop/src/*.ts' 'desktop/src/*.tsx' ':!desktop/src/*.test.ts' ':!desktop/src/*.test.tsx' ':!desktop/src/test/*'
