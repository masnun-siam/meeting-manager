name: tool

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "desktop/src-tauri/**"
      - .github/workflows/tool.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "crates/**"
      - "desktop/src-tauri/**"
      - .github/workflows/tool.yml

jobs:
  tool:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: command -v ffmpeg || brew install ffmpeg
      # The desktop crate embeds `desktop/dist` at compile time, so clippy and test need it built.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
