name: guards

# Runs on every pull request, whatever it changes: secrets in the PR's commits and the issue
# reference in its body, plus the contract tests of the hooks and CI pins (seconds). Matches the local pre-push secret scan (scripts/hooks/gates.sh).
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1 (checksum-pinned) over base..head
        run: |
          set -euo pipefail
          curl -fsSLo gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          ./gitleaks git --log-opts="origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}" --redact --no-banner .

  tooling:
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make test-tooling

  pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: body references its issue
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot: no issue reference required"
            exit 0
          fi
          if printf '%s' "$BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?) #[0-9]+'; then
            echo "issue reference found"
          else
            echo "::error::The PR body must reference its issue (Closes #<n>, or Refs #<n> for a step PR)."
            exit 1
          fi
