name: release

# Pushing a tag vX.Y.Z publishes Meeting.app with the matching `meeting` inside (FR-24, D46).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # actions/checkout drops the tag's annotation, which carries the release notes.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      # Before any build: a mismatch publishes nothing.
      - name: Check the versions match the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          app=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          metadata=$(cargo metadata --no-deps --format-version 1)
          tool=$(jq -r '.packages[] | select(.name == "meeting") | .version' <<<"$metadata")
          desktop=$(jq -r '.packages[] | select(.name == "meeting-desktop") | .version' <<<"$metadata")
          echo "tag $want, tauri.conf.json $app, meeting $tool, meeting-desktop $desktop"
          if [ "$app" != "$want" ] || [ "$tool" != "$want" ] || [ "$desktop" != "$want" ]; then
            echo "::error::Set all three versions to $want before tagging v$want."
            exit 1
          fi
      # Without the certificate the app would be ad-hoc signed and every update would
      # ask for the macOS permissions again (#239).
      - name: Check the signing secrets are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
            if [ -z "${!name}" ]; then
              echo "::error::Set the Actions secret $name (docs/development.md › Releasing)."
              missing=1
            fi
          done
          exit "$missing"
      # Pinned: Rust 1.100 moved build-script dirs to `build/<pkg>/<hash>/out`, and tauri-build
      # 2.6 (the newest that fits rust-version) then copies the bundled `meeting` onto the
      # `build/meeting` directory. Raise it once tauri-build is upgraded.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: cargo build --release -p meeting
        env:
          FEATURE_DESKTOP_APP: "1"
      # The Tauri CLI's own APPLE_CERTIFICATE import only accepts trusted identities and
      # refuses a self-signed one; codesign signs with it untrusted. So the identity goes
      # into a keychain of this job's own, and Tauri gets only its name.
      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          base64 --decode <<<"$APPLE_CERTIFICATE" > "$RUNNER_TEMP/signing.p12"
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nocerts -nodes -out "$RUNNER_TEMP/signing-key.pem"
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -passin env:APPLE_CERTIFICATE_PASSWORD -nokeys -out "$RUNNER_TEMP/signing-cert.pem"
          security import "$RUNNER_TEMP/signing-key.pem" -k "$keychain" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/signing-cert.pem" -k "$keychain"
          rm "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/signing-key.pem" "$RUNNER_TEMP/signing-cert.pem"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          search_list=()
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            search_list+=("${line//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${search_list[@]}"
      - name: Build Meeting.app and its updater bundle
        run: npx tauri build --config src-tauri/tauri.release.conf.json
        working-directory: desktop
        env:
          FEATURE_DESKTOP_APP: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Overrides the ad-hoc `signingIdentity` that local builds use.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      # macOS keys the permission grants on the designated requirement: it must name the
      # certificate, not this build's hash, or grants are lost on update.
      - name: Check Meeting.app is signed with the release certificate
        run: |
          app=target/release/bundle/macos/Meeting.app
          codesign --verify --deep --strict "$app"
          requirement=$(codesign -d -r- "$app" 2>&1)
          echo "$requirement"
          if grep -q cdhash <<<"$requirement" || ! grep -q "certificate leaf" <<<"$requirement"; then
            echo "::error::Meeting.app is not signed with the release certificate"
            exit 1
          fi
          entitlements=$(codesign -d --entitlements - "$app" 2>&1)
          for entitlement in device.audio-input personal-information.calendars; do
            if ! grep -q "$entitlement" <<<"$entitlements"; then
              echo "::error::Meeting.app lost the $entitlement entitlement"
              exit 1
            fi
          done
      - name: Write latest.json
        run: |
          bundle=target/release/bundle/macos
          # Notes come only from an annotated tag's message; a lightweight tag has none.
          : > "$RUNNER_TEMP/notes.md"
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag ]; then
            git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' > "$RUNNER_TEMP/notes.md"
          fi
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --rawfile notes "$RUNNER_TEMP/notes.md" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/Meeting.app.tar.gz" \
            --rawfile signature "$bundle/Meeting.app.tar.gz.sig" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {"darwin-aarch64": {signature: $signature, url: $url}}}' \
            > "$bundle/latest.json"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle=target/release/bundle/macos
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" \
            "$bundle/Meeting.app.tar.gz" "$bundle/Meeting.app.tar.gz.sig" "$bundle/latest.json"
