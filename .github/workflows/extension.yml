name: extension

on:
  push:
    branches: [main]
    paths: ["extension/**", .github/workflows/extension.yml]
  pull_request:
    paths: ["extension/**", .github/workflows/extension.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit
      - run: npx biome ci .
      - run: npx vitest run
