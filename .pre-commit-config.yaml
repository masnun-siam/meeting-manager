# Install once per clone: pre-commit install --hook-type pre-commit --hook-type pre-push
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: claude-md-nested
        name: only the root CLAUDE.md
        entry: scripts/repo-guards/claude-md-guard.sh nested
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: claude-md-generated
        name: no generated agent files
        entry: scripts/repo-guards/claude-md-guard.sh generated
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: claude-md-warn
        name: warn on constitution change
        entry: scripts/repo-guards/claude-md-guard.sh warn
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit]
      # Every gate below runs in the hook image (scripts/hooks/docker.sh), on changed files only;
      # the Tauri crate runs on the host (macOS-only). Full suites: make check and CI.
      - id: commit-gates
        name: secrets, suppressions, hygiene, rustfmt, biome (Docker)
        entry: scripts/hooks/run.sh commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: push-gates
        name: branch secrets, clippy, types, related tests, changed-line coverage >= 80%
        entry: scripts/hooks/run.sh push
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]
