[package]
name = "meeting-desktop"
version = "0.4.0"
edition = "2024"
rust-version = "1.87"

[lib]
name = "meeting_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meeting = { path = "../../crates/meeting" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
# `macos-private-api`: the indicator's transparent window (D17), with `app.macOSPrivateApi`.
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-single-instance = "2"
# Rust side only (D47): no capability lists it, so the webview cannot reach it.
tauri-plugin-updater = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# The macOS bindings the recorder, calendar and tray issues use. Each starts with no framework
# feature on; the issue that needs a class turns its cargo feature on here.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "NSArray",
    "NSDate",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFileManager",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSPredicate",
    "NSString",
    "NSTimeZone",
    "NSURL",
    "NSUUID",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSGraphics",
    "NSPanel",
    "NSPasteboard",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
objc2-event-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKParticipant",
    "EKSource",
    "EKTypes",
] }

[dev-dependencies]
tauri = { version = "2.11", features = ["test"] }
