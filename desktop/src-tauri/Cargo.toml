[package]
name = "meeting-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[lib]
name = "meeting_desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meeting = { path = "../../crates/meeting" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
pulldown-cmark = { version = "0.13", default-features = false }
# The macOS bindings the recorder, calendar and tray issues use. Each starts with no framework
# feature on; the issue that needs a class turns its cargo feature on here.
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tauri = { version = "2.11", features = ["test"] }
